<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomBook - Calendar</title>
  <link rel="stylesheet" href="/static/css/calendar.css">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=10">
  <link rel="shortcut icon" type="image/png" href="/static/favicon.png?v=10">
</head>
<body>

  <div class="page">

    <aside class="sidebar">
      <div class="logo">
        <h1>Room<span>Book</span></h1>
        <p>Meeting Room System</p>
      </div>

  <div class="user-box">
      <p>Logged in as</p>
      <strong id="user-name">User</strong>
  </div>

      <nav>
        <a href="/">Dashboard</a>
        <a href="/rooms">Rooms</a>
        <a href="/my-bookings">My Bookings</a>
        <a href="/calendar" class="active">Calendar</a>
      </nav>

      <button class="logout-button">
      Logout
      </button>

      <a href="/rooms" class="new-booking">+ New Booking</a>
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <h2>Calendar</h2>
          <p>View your room bookings by date</p>
        </div>

        <a href="/rooms" class="top-button">+ New Booking</a>
      </header>

      <section class="calendar-card">
        <div class="calendar-title">
          <h3 id="calendar-title">Loading...</h3>
        </div>

        <div class="days">
          <p>Sun</p>
          <p>Mon</p>
          <p>Tue</p>
          <p>Wed</p>
          <p>Thu</p>
          <p>Fri</p>
          <p>Sat</p>
        </div>

        <div class="dates" id="calendar-dates"></div>
      </section>
    </main>

  </div>

  <script src="/static/js/auth-redirect.js"></script>
  <script src="/static/js/logout.js"></script>
  <script src="/static/js/calendar.js"></script>
  <script src="/static/js/session-user.js"></script>
</body>
</html>
