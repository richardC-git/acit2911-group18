<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomBook - Rooms</title>
  <link rel="stylesheet" href="/static/css/rooms.css">
  <link rel="icon" type="image/png" href="/static/favicon.png?v=10">
  <link rel="shortcut icon" type="image/png" href="/static/favicon.png?v=10">
</head>
<body>

  <div class="page">

    <aside class="sidebar">
      <div class="logo">
        <h1>Room<span>Book</span></h1>
        <p>Meeting Room System</p>
      </div>

      <div class="user-box">
        <p>Logged in as</p>
        <strong id="user-name">User</strong>
      </div>

      <nav>
        <a href="/">Dashboard</a>
        <a href="/rooms" class="active">Rooms</a>
        <a href="/my-bookings">My Bookings</a>
        <a href="/calendar">Calendar</a>
      </nav>

      <button class="logout-button">
        Logout
      </button>
    
      <a href="/rooms" class="new-booking">+ New Booking</a>
    </aside>

    <main class="main">

      <header class="header">
        <div>
          <h2>Rooms</h2>
          <p>Browse available study rooms</p>
        </div>

        <a href="/rooms" class="top-button">
          + New Booking
        </a>
      </header>

      <section class="filters">
        <input
          type="text"
          id="room-search"
          placeholder="Search room number, features, capacity..."
        >

        <select id="campus-filter">
          <option value="all">All Campuses</option>
          <option value="Downtown">Downtown</option>
          <option value="Burnaby">Burnaby</option>
        </select>
      </section>

      <section class="rooms" id="rooms-list"></section>

    </main>

  </div>

  <script src="/static/js/rooms.js"></script>
  <script src="/static/js/logout.js"></script>
  <script src="/static/js/session-user.js"></script>
</body>
</html>
