<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomBook - Rooms</title>
  <link rel="stylesheet" href="/static/css/rooms.css">
</head>
<body>

  <div class="page">

    <aside class="sidebar">
      <div class="logo">
        <h1>Room<span>Book</span></h1>
        <p>Meeting Room System</p>
      </div>

      <nav>
        <a href="/">Dashboard</a>
        <a href="/rooms" class="active">Rooms</a>
        <a href="/my-bookings">My Bookings</a>
        <a href="/calendar">Calendar</a>
      </nav>

      <a href="/new-booking" class="new-booking">+ New Booking</a>
    </aside>

    <main class="main">

      <header class="header">
        <div>
          <h2>Rooms</h2>
          <p>Browse available study rooms</p>
        </div>

        <a href="/new-booking" class="top-button">
          + New Booking
        </a>
      </header>

      <section class="rooms" id="rooms-list"></section>

    </main>

  </div>

  <script>
    fetch("/api/rooms")
      .then(response => response.json())
      .then(rooms => {
        const roomsList = document.getElementById("rooms-list");

        rooms.forEach(room => {
          fetch(`/api/rooms/${room.id}/available-slots`)
            .then(response => response.json())
            .then(slots => {
              let slotsHtml = "";

              slots.forEach(slot => {
                slotsHtml += `
                  <li>
                    ${slot.start_time.slice(11, 16)} -
                    ${slot.end_time.slice(11, 16)}
                  </li>
                `;
              });

              const card = document.createElement("article");
              card.className = "room-card";

              card.innerHTML = `
                <div class="room-image">
                  <p>Study Room</p>
                </div>

                <div class="room-details">
                  <h3>Room ${room.room_number}</h3>

                  <p><strong>Campus:</strong> ${room.campus}</p>
                  <p><strong>Capacity:</strong> ${room.capacity}</p>
                  <p><strong>Features:</strong> ${room.features}</p>
                  <p>${room.description}</p>

                  <div class="slots">
                    <strong>Available Times:</strong>
                    <ul>
                      ${slotsHtml}
                    </ul>
                  </div>

                  <a href="/new-booking" class="top-button">
                    Book Room
                  </a>
                </div>
              `;

              roomsList.appendChild(card);
            });
        });
      });
  </script>

</body>
</html>
