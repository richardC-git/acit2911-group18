<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomBook - New Booking</title>
  <link rel="stylesheet" href="/static/css/rooms.css">
</head>
<body>

  <div class="page">

    <aside class="sidebar">
      <div class="logo">
        <h1>Room<span>Book</span></h1>
        <p>Study Room Booking System</p>
      </div>

      <nav>
        <a href="/">Dashboard</a>
        <a href="/rooms">Rooms</a>
        <a href="/my-bookings">My Bookings</a>
        <a href="/calendar">Calendar</a>
      </nav>

      <a href="/rooms" class="new-booking">Back to Rooms</a>
    </aside>

    <main class="main">

      <header class="header">
        <div>
          <h2 id="page-title">New Booking</h2>
          <p id="room-info">Loading room information...</p>
        </div>
      </header>

      <section class="room-card">
        <div class="room-details">

          <form id="booking-form">
            <label for="booking-date">Date</label>
            <input type="date" id="booking-date" value="2026-05-04">

            <br><br>

            <label for="time-slot">Available Time Slots</label>
            <select id="time-slot" required>
              <option value="">Loading available times...</option>
            </select>

            <br><br>

            <button type="submit" class="top-button">Submit Booking</button>
          </form>

          <p id="message"></p>

        </div>
      </section>

    </main>

  </div>

  <script src="/static/js/new-booking.js"></script>
</body>
</html>
