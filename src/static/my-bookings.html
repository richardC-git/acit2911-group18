<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomBook - My Bookings</title>
  <link rel="stylesheet" href="/static/css/my-bookings.css">
</head>
<body>

  <div class="page">

    <aside class="sidebar">
      <div class="logo">
        <h1>Room<span>Book</span></h1>
        <p>Study Room Booking System</p>
      </div>

      <nav>
        <a href="/">Dashboard</a>
        <a href="/rooms">Rooms</a>
        <a href="/my-bookings" class="active">My Bookings</a>
        <a href="/calendar">Calendar</a>
      </nav>

      <a href="/rooms" class="new-booking">+ New Booking</a>
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <h2>My Bookings</h2>
          <p>View your study room bookings</p>
        </div>

        <a href="/rooms" class="top-button">+ New Booking</a>
      </header>

      <section class="tabs">
        <a href="#" class="active-tab">All Bookings</a>
      </section>

      <section id="bookings-list">
        <section class="empty-card">
          <div class="empty-content">
            <p class="icon">Calendar</p>
            <h3>Loading bookings...</h3>
            <p>Please wait while your bookings are loaded.</p>
          </div>
        </section>
      </section>
    </main>

  </div>

  <script src="/static/js/my-bookings.js"></script>
</body>
</html>
